name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. `id-token: write` is granted only on the deploy job,
# which is the only one that federates to Azure.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_REPO_BACKEND: medpay/backend
  REGISTRY_REPO_FRONTEND: medpay/frontend

jobs:
  # ---------------------------------------------------------------------------
  # Jobs 1-3 need no cloud account and run on every push and pull request.
  # ---------------------------------------------------------------------------

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tip tree.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-test:
    name: Backend tests and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest runners ship one.
      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend-test:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        env:
          # CI-only value. The real secret is a Key Vault reference at runtime and never
          # appears in a workflow log, a build argument, or an image layer.
          MEDPAY_JWT_SECRET: ${{ secrets.MEDPAY_JWT_SECRET || 'Y2ktb25seS1zZWNyZXQtbmV2ZXItdXNlZC1vdXRzaWRlLWNvbnRpbnVvdXMtaW50ZWdyYXRpb24=' }}
        run: docker compose up -d --build --wait

      - name: Run specs
        working-directory: frontend
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Jobs 4-5 are gated. They are written, reviewed and committed now, but stay
  # dormant until an Azure subscription exists. Flip the repository variable
  # AZURE_ENABLED to "true" to activate them — see "Phase 10 — DEFERRED" in
  # PLAN.md for the ordered provisioning steps that must come first.
  # ---------------------------------------------------------------------------

  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [secret-scan, backend-test, frontend-test, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.AZURE_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        # The commit SHA is the deployable identity. `latest` is pushed for
        # convenience but is never deployed by reference — a rollback has to name
        # a specific SHA, and a moving tag makes that impossible.
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC, no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push backend
        run: |
          registry="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          tag="${{ steps.meta.outputs.sha }}"
          docker build -t "$registry/$REGISTRY_REPO_BACKEND:$tag" \
                       -t "$registry/$REGISTRY_REPO_BACKEND:latest" ./backend
          docker push "$registry/$REGISTRY_REPO_BACKEND:$tag"
          docker push "$registry/$REGISTRY_REPO_BACKEND:latest"

      - name: Build and push frontend
        run: |
          registry="${{ vars.AZURE_ACR_NAME }}.azurecr.io"
          tag="${{ steps.meta.outputs.sha }}"
          docker build -t "$registry/$REGISTRY_REPO_FRONTEND:$tag" \
                       -t "$registry/$REGISTRY_REPO_FRONTEND:latest" ./frontend
          docker push "$registry/$REGISTRY_REPO_FRONTEND:$tag"
          docker push "$registry/$REGISTRY_REPO_FRONTEND:latest"

  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: build-push
    if: vars.AZURE_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.AZURE_APP_URL }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the SHA-tagged image
        run: |
          az webapp config container set \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ vars.AZURE_ACR_NAME }}.azurecr.io/$REGISTRY_REPO_BACKEND:${{ needs.build-push.outputs.image-tag }}"
          az webapp restart \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"

      - name: Health poll
        # Bounded, and exits non-zero on failure. A deploy that silently leaves the
        # site down is worse than one that fails loudly.
        run: |
          url="${{ vars.AZURE_APP_URL }}/actuator/health"
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: ${status}"
            sleep 10
          done
          echo "Never became healthy within 5 minutes."
          exit 1
