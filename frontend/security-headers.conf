# =============================================================================
# Security headers, factored out because nginx's add_header inheritance is
# replace-not-merge: a location block that declares ANY add_header of its own
# silently drops every add_header inherited from the server block. Several
# locations here need their own Cache-Control, so each of them must re-include
# this file or it will serve responses with no CSP at all.
#
# `always` so the headers are present on error responses too — a 502 from the
# API proxy is still a document the browser will render.
# =============================================================================

# No 'unsafe-eval' anywhere. 'unsafe-inline' is granted to style-src only:
# Tailwind's preflight and React's inline style props both need it, and a style
# injection is a defacement rather than the script execution a script-src
# exemption would allow. connect-src is 'self' because every API call is
# same-origin through this proxy — that is the point of ADR-006.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
