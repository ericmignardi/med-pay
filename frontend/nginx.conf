# =============================================================================
# MedPay Ledger — SPA server and API reverse proxy.
#
# This is the only publicly addressable container in both topologies. It serves
# the built SPA and proxies the API on the same origin, which is what lets the
# backend register no CORS bean at all in prod (ADR-006).
#
# TLS terminates upstream (App Service), so this listens on plain :80.
#
# Security headers live in security-headers.conf and are included per location
# rather than set once here — see the comment at the top of that file for why.
# =============================================================================

server {
    listen       80;
    # The compose healthcheck wgets http://localhost/healthz, and busybox
    # resolves localhost to ::1 before 127.0.0.1. Without an IPv6 listener the
    # probe gets ECONNREFUSED while the service is in fact up and serving.
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The backend is not published to the host; `backend` resolves on the
    # compose network. Kept as a variable so an unresolvable name yields a 502
    # at request time rather than a refusal to start the whole container.
    set $backend_upstream "http://backend:8080";

    # Docker's embedded DNS. A `set`-based upstream is resolved at request time,
    # which needs an explicit resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Nginx's own version in the Server header tells a scanner which CVEs to try.
    server_tokens off;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # -------------------------------------------------------------------------
    # Container healthcheck target. Local so it stays green even when the
    # backend is down — this endpoint answers "is Nginx serving?", and conflating
    # it with backend health would make compose restart the wrong container.
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # API proxy — the whole reason this container fronts the backend.
    # -------------------------------------------------------------------------
    location /api/v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Adjudication holds a transaction open across the fee-schedule pass and
        # the ledger post. 60s is generous for that and still bounded.
        proxy_connect_timeout 5s;
        proxy_send_timeout   60s;
        proxy_read_timeout   60s;

        # A JWT in a cached response would be served to the next caller.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # Health only. Exposing /actuator wholesale would publish env, beans and
    # mappings; the backend also restricts its own exposure to `health`, so this
    # is the second of two locks.
    # -------------------------------------------------------------------------
    location = /actuator/health {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend_upstream/actuator/health;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;

        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # Static assets. Vite fingerprints every filename in dist/assets, so these
    # are safe to pin immutably; index.html must never be, or a deploy leaves
    # clients on a stale bundle referencing deleted chunks.
    # -------------------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # SPA fallback. React Router owns the path space, so a deep link like
    # /claims/{uuid} must return index.html rather than 404 — the router then
    # resolves it client-side.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
