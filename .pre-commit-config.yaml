# =============================================================================
# MedPay Ledger — pre-commit hooks.
#
#   pip install pre-commit
#   pre-commit install
#
# gitleaks is the point of this file (PLAN.md Phase 0, NFR-007). Phase 10 runs
# the same scan in CI, because a local hook is advisory — it is skipped by
# `--no-verify` and absent on any clone that never ran `pre-commit install`.
# =============================================================================

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # .env is git-ignored, but an explicit block means `git add -f .env`
      # fails loudly rather than quietly committing the JWT signing key.
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Trailing whitespace is significant in the fixture SQL Phase 1 adds.
        exclude: '\.sql$'
      - id: check-yaml
        # Compose files use no custom tags; the workflow files in Phase 10 will.
        args: ['--allow-multiple-documents']
      - id: check-json
