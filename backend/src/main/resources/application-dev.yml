spring:
  jpa:
    # Statements only, and they are parameterised - the values are bound separately
    # and are not part of what this logs.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    # Both origins the SPA is ever served from in development: Vite direct on 5173,
    # and the Nginx container on 8080. Omitting the Nginx origin makes every browser
    # POST fail with 403 while curl still succeeds, because curl sends no Origin header.
    allowed-origins: ${MEDPAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

logging:
  level:
    com.medpay.ledger: DEBUG
    # Bind tracing is off, and stays off, in every profile.
    #
    # It emits one line per bound parameter as a bare value - `binding parameter
    # (4:VARCHAR) <- [E1165]` - with no key for PhiMaskingConverter to anchor on, so
    # diagnosis_code and service_code reach the appender in cleartext. member_reference
    # survives only because the MBR- pattern matches it on its own.
    #
    # FR-030 states the rule without a profile carve-out, and `demo` groups into `dev`,
    # so this file is what the demo environment actually runs. Setting it in
    # application-demo.yml does not work: group members are appended after the group
    # name, so dev is resolved last and wins.
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql: WARN
