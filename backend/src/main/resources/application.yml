spring:
  application:
    name: medpay-ledger

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      demo: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medpay}
    username: ${SPRING_DATASOURCE_USERNAME:medpay}
    password: ${SPRING_DATASOURCE_PASSWORD:medpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${MEDPAY_JWT_SECRET}
    ttl-seconds: ${MEDPAY_JWT_TTL_SECONDS:3600}
