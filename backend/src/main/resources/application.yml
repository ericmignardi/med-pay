spring:
  application:
    name: medpay-ledger

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      demo: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medpay}
    username: ${SPRING_DATASOURCE_USERNAME:medpay}
    password: ${SPRING_DATASOURCE_PASSWORD:medpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    # The envelope in §5.6 declares fieldErrors and details as explicit nulls, so
    # absent values must serialize rather than be dropped.
    default-property-inclusion: always
    # Money crosses the wire as a decimal string, never a JSON number (§5.2).
    # That is enforced per-field by @JsonFormat(shape = STRING) on the DTO
    # records; Jackson 3 has no mapper-wide switch that produces a string.

  mvc:
    # The custom envelope in §5.6 is used instead of RFC 7807, for a client
    # contract that does not shift with the Spring version (FR-026).
    problemdetails:
      enabled: false

server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${MEDPAY_JWT_SECRET}
    ttl-seconds: ${MEDPAY_JWT_TTL_SECONDS:3600}
